name: "Setup Python Environment"
description: "Install Python 3.10 with uv for fast dependency installation."

inputs:
  requirements-file:
    description: "Path to the requirements file to install from (default: requirements.txt)"
    required: false
    default: "requirements.txt"
  extra-packages:
    description: "Space-separated list of extra pip packages to install (e.g. 'ruff pip-audit')"
    required: false
    default: ""
  skip-editable-install:
    description: "Skip pip install -e . (set to 'true' for jobs that don't need the package entry points)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "**/requirements*.txt"

    - name: Install dependencies
      shell: bash
      run: |
        uv pip install --system --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -r ${{ inputs.requirements-file }}
        if [ "${{ inputs.skip-editable-install }}" != "true" ]; then
          uv pip install --system -e .
        fi
        if [ -n "${{ inputs.extra-packages }}" ]; then
          uv pip install --system ${{ inputs.extra-packages }}
        fi
