name: Data Ingestion

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to ingest (auto-detected from date or current month if blank)"
        required: false
        type: string
      skip_torvik:
        description: "Skip Torvik scrape"
        required: false
        default: false
        type: boolean
      skip_sports_reference:
        description: "Skip Sports Reference scrape"
        required: false
        default: false
        type: boolean
      skip_rosters:
        description: "Skip roster ingestion"
        required: false
        default: false
        type: boolean
      skip_historical_games:
        description: "Skip historical games scrape"
        required: false
        default: false
        type: boolean
      historical_games_since:
        description: "Only fetch games from this date forward (ISO, e.g. 2026-03-08). Season year is auto-detected from this date. Auto-detected on scheduled runs."
        required: false
        type: string
      repair_only:
        description: "Skip full ingestion and only run the data quality repair script"
        required: false
        default: false
        type: boolean
      run_repair:
        description: "Run data quality repair script after ingestion"
        required: false
        default: true
        type: boolean
  schedule:
    # Every Monday at 6:00 UTC during regular season (Nov-Feb)
    - cron: "0 6 * 11-12,1-2 1"
    # Daily at 6:00 UTC during March Madness (March and April)
    - cron: "0 6 * 3-4 *"

concurrency:
  group: data-ingestion
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    name: Ingest Season Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Optional env vars (set in repo Settings > Secrets and variables > Actions):
    #   CBBDATA_API_KEY         - Pre-existing cbbdata.com API token (if you have one)
    #   CBD_USER + CBD_PASSWORD  - cbbdata.com login credentials (auto-obtains token)
    #   CBBDATA_BASE_URL        - Base URL override for cbbdata API (default: built-in)
    #   CBBPY_ROSTER_ENABLE_PBP - "true" to collect play-by-play stint data via cbbpy
    #   PLAYER_METRICS_URL      - URL to a player-metrics JSON feed (manual-provide)
    #   ESPN_PUBLIC_PICKS_URL   - JSON endpoint for ESPN bracket pick percentages
    #   YAHOO_PUBLIC_PICKS_URL  - JSON endpoint for Yahoo bracket pick percentages (discontinued)
    #   CBS_PUBLIC_PICKS_URL    - JSON endpoint for CBS bracket pick percentages
    #   THE_ODDS_API_KEY        - API key for The Odds API (aggregated sportsbook odds)
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || secrets.KAGGLE_USER }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      CBBDATA_API_KEY: ${{ secrets.CBBDATA_API_KEY }}
      CBD_USER: ${{ secrets.CBD_USER }}
      CBD_PASSWORD: ${{ secrets.CBD_PASSWORD }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CBBDATA_BASE_URL: ${{ vars.CBBDATA_BASE_URL }}
      CBBPY_ROSTER_ENABLE_PBP: ${{ vars.CBBPY_ROSTER_ENABLE_PBP }}
      PLAYER_METRICS_URL: ${{ vars.PLAYER_METRICS_URL }}
      ESPN_PUBLIC_PICKS_URL: ${{ vars.ESPN_PUBLIC_PICKS_URL }}
      YAHOO_PUBLIC_PICKS_URL: ${{ vars.YAHOO_PUBLIC_PICKS_URL }}
      CBS_PUBLIC_PICKS_URL: ${{ vars.CBS_PUBLIC_PICKS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Install R and toRvik (optional — enables primary Torvik data source)
        # toRvik R package calls the same cbbstat API as our Python fallback.
        # If installation fails the pipeline degrades gracefully to the Python path.
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends r-base r-cran-jsonlite 2>/dev/null || true
          Rscript -e "install.packages('toRvik', repos='https://cloud.r-project.org', quiet=TRUE)" || true

      - name: Determine year
        id: year
        run: |
          set -euo pipefail
          # If year was explicitly provided, use it
          if [ -n "${{ inputs.year }}" ]; then
            echo "value=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Derive from historical_games_since date if provided
          if [ -n "${{ inputs.historical_games_since }}" ]; then
            DATE="${{ inputs.historical_games_since }}"
            MONTH=$(date -d "$DATE" +%-m)
            YEAR=$(date -d "$DATE" +%Y)
            if [ "$MONTH" -ge 11 ]; then
              YEAR=$((YEAR + 1))
            fi
            echo "value=$YEAR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fall back to current date (scheduled runs or manual without either field)
          MONTH=$(date +%-m)
          YEAR=$(date +%Y)
          if [ "$MONTH" -ge 11 ]; then
            YEAR=$((YEAR + 1))
          fi
          echo "value=$YEAR" >> "$GITHUB_OUTPUT"

      - name: Build ingestion flags
        id: flags
        run: |
          set -euo pipefail
          FLAGS="--year ${{ steps.year.outputs.value }} --allow-invalid-payloads"
          if [ "${{ inputs.skip_torvik }}" = "true" ]; then
            FLAGS="$FLAGS --skip-torvik"
          fi
          if [ "${{ inputs.skip_sports_reference }}" = "true" ]; then
            FLAGS="$FLAGS --skip-sports-reference"
          fi
          if [ "${{ inputs.skip_rosters }}" = "true" ]; then
            FLAGS="$FLAGS --skip-rosters"
          fi
          if [ "${{ inputs.skip_historical_games }}" = "true" ]; then
            FLAGS="$FLAGS --skip-historical-games"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Detect incremental games window
        id: incremental
        run: |
          set -euo pipefail
          YEAR="${{ steps.year.outputs.value }}"
          FILE="data/raw/historical_games_${YEAR}.json"

          # Manual override takes priority
          if [ -n "${{ inputs.historical_games_since }}" ]; then
            echo "flag=--historical-games-since ${{ inputs.historical_games_since }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For scheduled runs: if data exists, do incremental from last game date
          if [ -f "$FILE" ]; then
            LAST_DATE=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('$FILE'))
              games = data.get('games', [])
              dates = [g['date'] for g in games if g.get('date')]
              if dates:
                  print(max(dates))
              else:
                  print('')
          except (json.JSONDecodeError, KeyError, TypeError) as e:
              print(f'::warning::Failed to parse {\"$FILE\"}: {e}', file=sys.stderr)
              print('')
          ")
            if [ -n "$LAST_DATE" ]; then
              NEXT_DATE=$(date -d "$LAST_DATE + 1 day" +%Y-%m-%d)
              echo "Existing data through $LAST_DATE, fetching incrementally from $NEXT_DATE"
              echo "flag=--historical-games-since $NEXT_DATE" >> "$GITHUB_OUTPUT"
            else
              echo "flag=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No existing data, full scrape"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run data ingestion
        if: inputs.repair_only != true
        run: |
          set -euo pipefail
          python -m src.main ingest ${{ steps.flags.outputs.flags }} ${{ steps.incremental.outputs.flag }}

      - name: Run data quality repair
        if: inputs.repair_only == true || inputs.run_repair != false
        run: |
          set -euo pipefail
          YEAR="${{ steps.year.outputs.value }}"
          SCRIPT="scripts/repair_${YEAR}_data_quality.py"
          if [ -f "$SCRIPT" ]; then
            echo "Using year-specific repair script: $SCRIPT"
            python "$SCRIPT" --year "$YEAR"
          else
            # Fall back to the most recent year-specific repair script
            LATEST=$(ls scripts/repair_*_data_quality.py 2>/dev/null | sort -t_ -k2 -n | tail -1)
            if [ -n "$LATEST" ]; then
              echo "::warning::No repair script for year $YEAR. Using latest available: $LATEST"
              echo "::warning::The fallback script may not handle year-specific data correctly."
              python "$LATEST" --year "$YEAR"
            else
              echo "::warning::No repair scripts found in scripts/ directory, skipping repair step."
            fi
          fi

      - name: Prune stale cache files
        run: |
          # Remove cache files older than 14 days to prevent unbounded growth
          find data/raw/cache -type f -mtime +14 -delete 2>/dev/null || true
          # Remove empty directories left behind
          find data/raw/cache -type d -empty -delete 2>/dev/null || true

      - name: Commit and push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            BRANCH="auto/data-ingestion-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            YEAR="${{ steps.year.outputs.value }}"
            git commit -m "chore: update ${YEAR} season data ($(date -u +%Y-%m-%d))"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --fill --base main)
            gh pr merge --rebase --delete-branch --auto "$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
