name: Data Ingestion

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to ingest"
        required: true
        default: "2026"
        type: string
      skip_torvik:
        description: "Skip Torvik scrape"
        required: false
        default: false
        type: boolean
      skip_sports_reference:
        description: "Skip Sports Reference scrape"
        required: false
        default: false
        type: boolean
      skip_rosters:
        description: "Skip roster ingestion"
        required: false
        default: false
        type: boolean
      skip_historical_games:
        description: "Skip historical games scrape (slow day-by-day fetch)"
        required: false
        default: false
        type: boolean
      repair_only:
        description: "Skip full ingestion and only run the data quality repair script"
        required: false
        default: false
        type: boolean
      run_repair:
        description: "Run data quality repair script after ingestion"
        required: false
        default: true
        type: boolean
  schedule:
    # Every Monday at 6:00 UTC during college basketball season (Nov-Apr)
    - cron: "0 6 * 11-12,1-4 1"

concurrency:
  group: data-ingestion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Season Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine year
        id: year
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # During scheduled runs, use current year for Jan-Apr, or next year for Nov-Dec
            MONTH=$(date +%-m)
            YEAR=$(date +%Y)
            if [ "$MONTH" -ge 11 ]; then
              YEAR=$((YEAR + 1))
            fi
            echo "value=$YEAR" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ingestion flags
        id: flags
        run: |
          FLAGS="--year ${{ steps.year.outputs.value }} --allow-invalid-payloads"
          if [ "${{ inputs.skip_torvik }}" = "true" ]; then
            FLAGS="$FLAGS --skip-torvik"
          fi
          if [ "${{ inputs.skip_sports_reference }}" = "true" ]; then
            FLAGS="$FLAGS --skip-sports-reference"
          fi
          if [ "${{ inputs.skip_rosters }}" = "true" ]; then
            FLAGS="$FLAGS --skip-rosters"
          fi
          if [ "${{ inputs.skip_historical_games }}" = "true" ]; then
            FLAGS="$FLAGS --skip-historical-games"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Auto-skip historical games if data is fresh
        id: auto_skip
        run: |
          YEAR="${{ steps.year.outputs.value }}"
          FILE="data/raw/historical_games_${YEAR}.json"
          if [ -f "$FILE" ]; then
            FILE_AGE_HOURS=$(( ($(date +%s) - $(stat -c %Y "$FILE")) / 3600 ))
            if [ "$FILE_AGE_HOURS" -lt 48 ]; then
              echo "Historical games file is ${FILE_AGE_HOURS}h old (<48h), skipping scrape"
              echo "flag=--skip-historical-games" >> "$GITHUB_OUTPUT"
            else
              echo "Historical games file is ${FILE_AGE_HOURS}h old (>=48h), re-scraping"
              echo "flag=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No historical games file, will scrape"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run data ingestion
        if: inputs.repair_only != true
        run: python -m src.main ingest ${{ steps.flags.outputs.flags }} ${{ steps.auto_skip.outputs.flag }}

      - name: Run data quality repair
        if: inputs.repair_only == true || inputs.run_repair != false
        run: python scripts/repair_2026_data_quality.py --year ${{ steps.year.outputs.value }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            YEAR="${{ steps.year.outputs.value }}"
            git commit -m "chore: update ${YEAR} season data ($(date -u +%Y-%m-%d))"
            git push
          fi
