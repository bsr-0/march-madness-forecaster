name: ESPN Picks Ingestion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ingestion mode"
        required: true
        type: choice
        options:
          - kaggle-import
          - scrape
          - csv-import
          - validate
        default: kaggle-import
      years:
        description: "Space-separated years (scrape/kaggle mode, e.g. '2023 2024 2025')"
        required: false
        type: string
        default: "2018 2019 2021 2022 2023 2024 2025"
      csv_year:
        description: "Tournament year for CSV import (csv-import mode only)"
        required: false
        type: string
      csv_artifact:
        description: "Name of uploaded CSV artifact (csv-import mode only)"
        required: false
        type: string
        default: "espn-picks-csv"

concurrency:
  group: espn-picks-ingestion
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  kaggle-import:
    name: Import from Kaggle
    if: inputs.mode == 'kaggle-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Download and import Kaggle data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/scrape_historical_espn_picks.py --from-kaggle

      - name: Validate imported data
        run: python scripts/scrape_historical_espn_picks.py --validate
        continue-on-error: true

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: espn-picks-kaggle
          path: data/raw/historical_public_picks/*.json
          retention-days: 90

      - name: Commit and push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/historical_public_picks/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            BRANCH="auto/espn-picks-kaggle-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "chore: import real ESPN public picks from Kaggle dataset ($(date -u +%Y-%m-%d))"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --fill --base main)
            gh pr merge --squash --delete-branch --auto "$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate Existing Data
    if: inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Validate ESPN pick files
        run: python scripts/scrape_historical_espn_picks.py --validate

  scrape:
    name: Scrape from Wayback Machine
    if: inputs.mode == 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Scrape ESPN picks
        run: |
          set -euo pipefail
          python scripts/scrape_historical_espn_picks.py --years ${{ inputs.years }}

      - name: Validate scraped data
        run: python scripts/scrape_historical_espn_picks.py --validate
        continue-on-error: true

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: espn-picks-scraped
          path: data/raw/historical_public_picks/*.json
          retention-days: 90

      - name: Commit and push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/historical_public_picks/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            BRANCH="auto/espn-picks-scraped-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "chore: update ESPN public pick data ($(date -u +%Y-%m-%d))"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --fill --base main)
            gh pr merge --squash --delete-branch --auto "$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  csv-import:
    name: Import from CSV
    if: inputs.mode == 'csv-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.csv_year }}" ]; then
            echo "::error::csv_year is required for csv-import mode"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Download CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.csv_artifact }}
          path: /tmp/csv-import

      - name: Find and import CSV
        run: |
          set -euo pipefail
          CSV_FILE=$(find /tmp/csv-import -name '*.csv' -type f | head -1)
          if [ -z "$CSV_FILE" ]; then
            echo "::error::No CSV file found in artifact '${{ inputs.csv_artifact }}'"
            exit 1
          fi
          echo "Importing from: $CSV_FILE"
          python scripts/scrape_historical_espn_picks.py \
            --from-csv "$CSV_FILE" \
            --year ${{ inputs.csv_year }}

      - name: Validate imported data
        run: python scripts/scrape_historical_espn_picks.py --validate

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: espn-picks-imported-${{ inputs.csv_year }}
          path: data/raw/historical_public_picks/espn_picks_${{ inputs.csv_year }}.json
          retention-days: 90

      - name: Commit and push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/historical_public_picks/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            BRANCH="auto/espn-picks-csv-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "chore: import ESPN picks for ${{ inputs.csv_year }} from CSV"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --fill --base main)
            gh pr merge --squash --delete-branch --auto "$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
