# Deploy static site from docs/ to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate docs artifact inputs
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "docs/predictions.html"
            "docs/predictions-2026.html"
            "docs/methodology.html"
            "docs/results.html"
            "docs/style.css"
            "docs/data/bracket_2026.json"
            "docs/data/validation_2025.json"
            "docs/data/model_metrics.json"
            "docs/data/team_profiles.json"
          )
          missing=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = json.loads(Path("docs/data/dashboard.json").read_text(encoding="utf-8"))
          preds = json.loads(Path("docs/data/conference_predictions_2026.json").read_text(encoding="utf-8"))

          if not isinstance(dashboard, dict) or not dashboard:
              raise SystemExit("dashboard.json is empty or invalid object")
          if not isinstance(preds, dict) or not preds:
              raise SystemExit("conference_predictions_2026.json is empty or invalid object")
          print("JSON payload validation passed.")
          PY

          echo "Docs artifact validation passed."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed pages and data
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::Missing page URL output from deploy job."
            exit 1
          fi

          BASE_URL="${PAGE_URL%/}/"

          echo "Waiting 30s for CDN propagation..."
          sleep 30

          URLS=(
            "${BASE_URL}"
            "${BASE_URL}predictions.html"
            "${BASE_URL}predictions-2026.html"
            "${BASE_URL}results.html"
            "${BASE_URL}methodology.html"
            "${BASE_URL}style.css"
            "${BASE_URL}data/dashboard.json"
            "${BASE_URL}data/conference_predictions_2026.json"
            "${BASE_URL}data/bracket_2026.json"
            "${BASE_URL}data/validation_2025.json"
          )

          for url in "${URLS[@]}"; do
            ok=0
            for attempt in {1..15}; do
              status="$(curl -sS -o /tmp/page.out -w "%{http_code}" "$url" || true)"
              if [ "$status" = "200" ]; then
                ok=1
                break
              fi
              echo "Attempt ${attempt}/15: ${url} returned ${status}; retrying in 10s..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Smoke test failed for ${url}"
              exit 1
            fi
          done

          curl -fsSL -o /tmp/predictions.html "${BASE_URL}predictions.html"
          grep -q "2026 NCAA Tournament Predictions" /tmp/predictions.html
          curl -fsSL -o /tmp/style.css "${BASE_URL}style.css"
          grep -q -- "--color-accent" /tmp/style.css
          curl -fsSL -o /tmp/dashboard.json "${BASE_URL}data/dashboard.json"
          python -c "import json,sys; d=json.load(open('/tmp/dashboard.json')); assert isinstance(d, dict) and len(d) > 0"
          curl -fsSL -o /tmp/conf_predictions.json "${BASE_URL}data/conference_predictions_2026.json"
          python -c "import json,sys; d=json.load(open('/tmp/conf_predictions.json')); assert isinstance(d, dict) and len(d) > 0"
          echo "Post-deploy smoke test passed."
