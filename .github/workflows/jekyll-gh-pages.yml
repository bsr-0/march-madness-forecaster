# Deploy static site from docs/ to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate docs artifact inputs
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "docs/index.html"
            "docs/style.css"
            "docs/data/bracket_2026.json"
            "docs/data/validation_2025.json"
            "docs/data/model_metrics.json"
            "docs/data/team_profiles.json"
          )
          missing=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = json.loads(Path("docs/data/dashboard.json").read_text(encoding="utf-8"))
          preds = json.loads(Path("docs/data/conference_predictions_2026.json").read_text(encoding="utf-8"))

          if not isinstance(dashboard, dict) or not dashboard:
              raise SystemExit("dashboard.json is empty or invalid object")
          if not isinstance(preds, dict) or not preds:
              raise SystemExit("conference_predictions_2026.json is empty or invalid object")
          print("JSON payload validation passed.")
          PY

          echo "Docs artifact validation passed."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed pages and data
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::Missing page URL output from deploy job."
            exit 1
          fi

          BASE_URL="${PAGE_URL%/}/"
          echo "Base URL: ${BASE_URL}"

          # Wait for GitHub Pages CDN to propagate the new deployment.
          # GitHub Pages can take 2-5 minutes after deploy-pages completes.
          echo "Waiting 120s for CDN propagation..."
          sleep 120

          # First, do a quick reachability check on the root URL to fail fast
          # if Pages is fundamentally not configured (persistent 403/404).
          echo "Checking root URL reachability..."
          root_status="$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}" || true)"
          if [ "$root_status" = "403" ]; then
            echo "::warning::Root URL returned 403. Waiting an additional 120s in case Pages is still provisioning..."
            sleep 120
            root_status="$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}" || true)"
            if [ "$root_status" = "403" ]; then
              echo "::error::Root URL still returns 403 after extended wait. GitHub Pages may not be enabled or the site is not public."
              echo "::error::Verify: Settings > Pages > Source is set to 'GitHub Actions' and visibility is 'Public'."
              exit 1
            fi
          fi
          echo "Root URL returned ${root_status}"

          URLS=(
            "${BASE_URL}"
            "${BASE_URL}style.css"
            "${BASE_URL}data/dashboard.json"
            "${BASE_URL}data/conference_predictions_2026.json"
            "${BASE_URL}data/bracket_2026.json"
            "${BASE_URL}data/validation_2025.json"
          )

          MAX_ATTEMPTS=45
          RETRY_INTERVAL=10

          for url in "${URLS[@]}"; do
            ok=0
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              status="$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/page.out -w "%{http_code}" "$url" || true)"
              if [ "$status" = "200" ]; then
                ok=1
                echo "OK: ${url}"
                break
              fi
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: ${url} returned ${status}; retrying in ${RETRY_INTERVAL}s..."
              sleep "$RETRY_INTERVAL"
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Smoke test failed for ${url} (last status: ${status} after ${MAX_ATTEMPTS} attempts)"
              cat /tmp/page.out 2>/dev/null || true
              exit 1
            fi
          done

          echo "All URLs reachable. Running content validation..."

          curl -fsSL -o /tmp/style.css "${BASE_URL}style.css"
          grep -q -- "--color-accent" /tmp/style.css
          curl -fsSL -o /tmp/dashboard.json "${BASE_URL}data/dashboard.json"
          python -c "import json,sys; d=json.load(open('/tmp/dashboard.json')); assert isinstance(d, dict) and len(d) > 0"
          curl -fsSL -o /tmp/conf_predictions.json "${BASE_URL}data/conference_predictions_2026.json"
          python -c "import json,sys; d=json.load(open('/tmp/conf_predictions.json')); assert isinstance(d, dict) and len(d) > 0"
          echo "Post-deploy smoke test passed."
