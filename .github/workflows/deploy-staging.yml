name: Staging Deployment Validation

on:
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  staging-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.10-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.10-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline dry-run
        run: |
          python -c "
          import json
          import sys
          from pathlib import Path

          # Validate that the pipeline module can be imported and configured
          from src.pipeline.config import SOTAPipelineConfig
          config = SOTAPipelineConfig(
              num_simulations=100,
              random_seed=42,
          )
          print(f'Pipeline config created: num_simulations={config.num_simulations}')
          print('Staging validation: pipeline module imports OK')
          "

      - name: Archive validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation
          path: |
            data/processed/*.json
            data/raw/*.json
            data/raw/*.csv
            docs/data/*.json
