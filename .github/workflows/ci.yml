name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/ --output-format=github

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --tb=short -q

  phase3-data-integrity:
    name: Phase 3 Data Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Contract schema validation
        run: |
          python -c "
          from src.data.contract_validator import ContractValidator
          v = ContractValidator()
          r = v.validate()
          print(r.summary())
          assert r.passed, 'Contract validation FAILED'
          "

      - name: Leakage rules tests
        run: pytest tests/data_integrity/test_leakage_rules.py -v --tb=short -q

      - name: Training row assembly tests
        run: pytest tests/data_integrity/test_training_row_assembly.py -v --tb=short -q

      - name: Point-in-time contract tests
        run: pytest tests/data_integrity/test_point_in_time_contracts.py -v --tb=short -q

      - name: Lineage manifest tests
        run: pytest tests/data_integrity/test_lineage_manifests.py -v --tb=short -q

      - name: Provider robustness tests
        run: pytest tests/data_integrity/test_provider_robustness.py -v --tb=short -q

      - name: No untested features check
        run: |
          python -c "
          import yaml
          from pathlib import Path
          contracts = yaml.safe_load(open('contracts/feature_contracts.yaml'))
          untested = [f['feature_name'] for f in contracts['features'] if not f.get('test_ids')]
          assert not untested, f'Untested features: {untested}'
          print(f'All {len(contracts[\"features\"])} features have test_ids.')
          "

  phase4-snapshot-integrity:
    name: Phase 4 Snapshot Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Selection Sunday snapshot tests
        run: pytest tests/evaluation/test_selection_snapshot.py -v --tb=short -q

      - name: Round segmentation tests
        run: pytest tests/evaluation/test_round_segmentation.py -v --tb=short -q

      - name: Calibration metrics tests
        run: pytest tests/evaluation/test_calibration_metrics.py -v --tb=short -q

  phase5-calibration:
    name: Phase 5 Calibration Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calibration methods tests
        run: pytest tests/evaluation/test_calibration_methods.py -v --tb=short -q

      - name: Calibration benchmark tests
        run: pytest tests/evaluation/test_calibration_benchmark.py -v --tb=short -q

      - name: Reliability tracking tests
        run: pytest tests/evaluation/test_reliability_tracking.py -v --tb=short -q

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip audit
        run: pip-audit --strict
