name: CI Pipeline

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: ruff

      - name: Run ruff linter
        run: ruff check src/ tests/ --output-format=github

  # ─── Gate 0: Freeze Staleness Check ─────────────────────────────
  freeze-check:
    name: "Gate 0: Freeze Staleness Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Check freeze artifact is up-to-date
        run: |
          python - <<'PYEOF'
          import hashlib, json, sys

          FREEZE_PATH = "artifacts/pipeline_freeze_2026.json"
          CONFIG_PATH = "configs/production_2026.json"

          REQUIRED_SOURCE_FILES = [
              "src/pipeline/config.py",
              "src/pipeline/sota.py",
              "src/pipeline/tournament_pipeline.py",
              "src/pipeline/pipeline_runner.py",
              "src/pipeline/probability_predictor.py",
              "src/pipeline/pipeline_state.py",
              "src/pipeline/stages/baseline_training.py",
              "src/pipeline/stages/calibration.py",
              "src/pipeline/stages/data_loader.py",
              "src/pipeline/stages/inference.py",
              "src/pipeline/probability_pipeline.py",
              "src/governance/production_validator.py",
              "src/governance/production_runner.py",
          ]

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(8192), b""):
                      h.update(chunk)
              return h.hexdigest()

          # Load freeze artifact
          try:
              with open(FREEZE_PATH) as f:
                  freeze = json.load(f)
          except FileNotFoundError:
              print(f"::error::Freeze artifact not found at {FREEZE_PATH}.")
              print("Run: march-madness freeze-pipeline")
              sys.exit(1)

          errors = []

          # Check source file hashes
          frozen_hashes = freeze.get("source_file_hashes", {})
          for src_file in REQUIRED_SOURCE_FILES:
              frozen_hash = frozen_hashes.get(src_file)
              if frozen_hash is None:
                  errors.append(f"{src_file}: missing from freeze artifact")
                  continue
              current_hash = sha256_file(src_file)
              if current_hash != frozen_hash:
                  errors.append(f"{src_file}: hash mismatch (source changed since freeze)")

          # Check config fields count matches current config schema
          frozen_fields = freeze.get("config_fields", {})
          try:
              sys.path.insert(0, ".")
              from src.pipeline.config import SOTAPipelineConfig
              current_field_names = set(SOTAPipelineConfig.__dataclass_fields__.keys())
              frozen_field_names = set(frozen_fields.keys())
              missing_in_freeze = current_field_names - frozen_field_names
              if missing_in_freeze:
                  errors.append(
                      f"Config fields added but not in freeze: {sorted(missing_in_freeze)}"
                  )
          except Exception as e:
              errors.append(f"Could not import SOTAPipelineConfig: {e}")

          if errors:
              print("::error::Freeze artifact is STALE. Update it before merging.")
              print()
              print("Mismatches found:")
              for e in errors:
                  print(f"  - {e}")
              print()
              print("To fix, run locally:")
              print("  python -c \"")
              print("  from src.governance.production_runner import regenerate_freeze")
              print("  regenerate_freeze()\"")
              print("or manually update artifacts/pipeline_freeze_2026.json")
              sys.exit(1)
          else:
              print(f"Freeze artifact is up-to-date ({len(frozen_hashes)} source files, "
                    f"{len(frozen_fields)} config fields verified).")
          PYEOF

  # ─── Gate 1: Unit Tests ───────────────────────────────────────────
  unit-tests:
    name: "Gate 1: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Run unit tests
        run: pytest tests/ -m "unit" --cov=src --cov-report=term-missing --tb=short -q

  # ─── Gate 2: Data-Contract Tests ──────────────────────────────────
  data-contract-tests:
    name: "Gate 2: Data-Contract Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Contract governance checks
        run: |
          python -c "
          import yaml
          from src.data.contract_validator import ContractValidator

          validator = ContractValidator()
          result = validator.validate()
          print(result.summary())
          assert result.passed, 'Contract validation FAILED'

          contracts = yaml.safe_load(open('contracts/feature_contracts.yaml'))
          untested = [f['feature_name'] for f in contracts['features'] if not f.get('test_ids')]
          assert not untested, f'Untested features: {untested}'
          print(f'All {len(contracts[\"features\"])} features have test_ids.')
          "

      - name: Data-contract marker tests
        run: pytest tests/ -m "data_contract" -v --tb=short -q

  # ─── Gate 3: Leakage Tests (statistical, not just mechanical) ────
  leakage-tests:
    name: "Gate 3: Leakage Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Run leakage tests
        run: pytest tests/ -m "leakage" -v --tb=short -q

  # ─── Dependency Audit ─────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: pip-audit
          skip-editable-install: "true"

      - name: Run pip audit
        run: pip-audit --strict --skip-editable --ignore-vuln CVE-2026-4539

  # ─── Gate 4: Performance Regression ──────────────────────────────
  performance-check:
    name: "Gate 4: Performance Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: pytest-timeout

      - name: Run unit tests with timeout
        run: pytest tests/ -m "unit" --timeout=300 --tb=short -q

      - name: Track test count for regression detection
        run: |
          TEST_COUNT=$(pytest tests/ --co -q 2>/dev/null | tail -1 | grep -oP '^\d+')
          echo "Total tests collected: ${TEST_COUNT}"
          echo "test_count=${TEST_COUNT}" >> $GITHUB_ENV

  # ─── All Gates Must Pass ──────────────────────────────────────────
  all-gates:
    name: "All Gates Green"
    needs:
      - lint
      - freeze-check
      - unit-tests
      - data-contract-tests
      - leakage-tests
      - audit
      - performance-check
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: echo "All CI gates passed — safe for production use"
