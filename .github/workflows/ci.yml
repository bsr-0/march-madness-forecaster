name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/ --output-format=github

  # ─── Gate 1: Unit Tests ───────────────────────────────────────────
  unit-tests:
    name: "Gate 1: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -m "unit" --cov=src --cov-report=term-missing --tb=short -q

  # ─── Gate 2: Data-Contract Tests ──────────────────────────────────
  data-contract-tests:
    name: "Gate 2: Data-Contract Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Contract schema validation
        run: |
          python -c "
          from src.data.contract_validator import ContractValidator
          v = ContractValidator()
          r = v.validate()
          print(r.summary())
          assert r.passed, 'Contract validation FAILED'
          "

      - name: Data-contract marker tests
        run: pytest tests/ -m "data_contract" -v --tb=short -q

      - name: No untested features check
        run: |
          python -c "
          import yaml
          from pathlib import Path
          contracts = yaml.safe_load(open('contracts/feature_contracts.yaml'))
          untested = [f['feature_name'] for f in contracts['features'] if not f.get('test_ids')]
          assert not untested, f'Untested features: {untested}'
          print(f'All {len(contracts[\"features\"])} features have test_ids.')
          "

  # ─── Gate 3: Leakage Tests (statistical, not just mechanical) ────
  leakage-tests:
    name: "Gate 3: Leakage Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run leakage tests
        run: pytest tests/ -m "leakage" -v --tb=short -q

  # ─── Gate 4: Backtest Regression Tests ────────────────────────────
  backtest-regression-tests:
    name: "Gate 4: Backtest Regression Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest regression tests
        run: pytest tests/ -m "backtest_regression" -v --tb=short -q

  # ─── Gate 5: Freeze / Reproducibility Tests ───────────────────────
  freeze-reproducibility-tests:
    name: "Gate 5: Freeze / Reproducibility Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run freeze and reproducibility tests
        run: pytest tests/ -m "freeze or production" -v --tb=short -q

  # ─── Gate 6: Calibration Tests ────────────────────────────────────
  calibration-tests:
    name: "Gate 6: Calibration Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run calibration tests
        run: pytest tests/ -m "calibration" -v --tb=short -q

  # ─── Dependency Audit ─────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip audit
        run: pip-audit --strict

  # ─── All Gates Must Pass ──────────────────────────────────────────
  all-gates:
    name: "All Gates Green"
    needs:
      - lint
      - unit-tests
      - data-contract-tests
      - leakage-tests
      - backtest-regression-tests
      - freeze-reproducibility-tests
      - calibration-tests
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: echo "All CI gates passed — safe for production use"
