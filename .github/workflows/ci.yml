name: CI Pipeline

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main, master]
  # workflow_dispatch lets other workflows trigger CI on a given branch via
  # `gh workflow run ci.yml --ref <branch>`. Required because PRs opened by
  # workflows using the default GITHUB_TOKEN do NOT fire `pull_request` events,
  # so any bot-authored PR (e.g. auto/outcome-log-*) would otherwise never see CI run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Fast Gate (lint) — always blocking, no deps, ~15-20s ───────────────
  fast-gate:
    name: "Fast Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ruff linter
        run: pipx run ruff check src/ tests/ --output-format=github

  # ─── Freeze Check — seasonal gate ───────────────────────────────────────────
  # Enforcement window (blocking): Jan 1 through Apr 7 each year — the
  # pre-tournament + tournament weeks when freeze drift would corrupt a live
  # forecast. Outside that window (Apr 8 – Dec 31) the check still RUNS so
  # drift stays visible as red/green, but it does not block merges — this is
  # the experimentation / backtesting / pool-optimization edit window.
  # Auto-rearms on Jan 1 every year; no manual flip needed.
  freeze-check:
    name: "Freeze Artifact Check"
    runs-on: ubuntu-latest
    steps:
      - name: Check if in enforcement window
        id: window
        run: |
          MMDD=$(date -u +%m-%d)
          # Blocking: Jan 1 – Apr 7 (pre-tournament + tournament).
          # Outside that window: skip entirely to avoid noisy red checks.
          if [[ "$MMDD" < "04-08" ]]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Freeze check skipped — outside tournament window (Apr 8 – Dec 31)"
          fi

      - name: Checkout
        if: steps.window.outputs.in_window == 'true'
        uses: actions/checkout@v4

      - name: Check freeze artifact is up-to-date
        if: steps.window.outputs.in_window == 'true'
        run: |
          python3 - <<'PYEOF'
          import ast, hashlib, json, sys

          FREEZE_PATH = "artifacts/pipeline_freeze_2026.json"

          REQUIRED_SOURCE_FILES = [
              "src/pipeline/config.py",
              "src/pipeline/sota.py",
              "src/pipeline/tournament_pipeline.py",
              "src/pipeline/pipeline_runner.py",
              "src/pipeline/stages/calibration.py",
              "src/pipeline/stages/data_loader.py",
              "src/pipeline/stages/inference.py",
              "src/pipeline/probability_pipeline.py",
              "src/governance/production_validator.py",
              "src/governance/production_runner.py",
          ]

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(8192), b""):
                      h.update(chunk)
              return h.hexdigest()

          def extract_dataclass_fields(filepath, class_name):
              """Extract field names from a @dataclass using AST (no imports needed)."""
              with open(filepath) as f:
                  tree = ast.parse(f.read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      fields = set()
                      for item in node.body:
                          if isinstance(item, ast.AnnAssign) and isinstance(item.target, ast.Name):
                              fields.add(item.target.id)
                      return fields
              return None

          try:
              with open(FREEZE_PATH) as f:
                  freeze = json.load(f)
          except FileNotFoundError:
              print(f"::error::Freeze artifact not found at {FREEZE_PATH}.")
              print("Run: march-madness freeze-pipeline")
              sys.exit(1)

          errors = []

          frozen_hashes = freeze.get("source_file_hashes", {})
          for src_file in REQUIRED_SOURCE_FILES:
              frozen_hash = frozen_hashes.get(src_file)
              if frozen_hash is None:
                  errors.append(f"{src_file}: missing from freeze artifact")
                  continue
              current_hash = sha256_file(src_file)
              if current_hash != frozen_hash:
                  errors.append(f"{src_file}: hash mismatch (source changed since freeze)")

          frozen_fields = freeze.get("config_fields", {})
          current_field_names = extract_dataclass_fields(
              "src/pipeline/config.py", "SOTAPipelineConfig"
          )
          if current_field_names is None:
              errors.append("Could not find SOTAPipelineConfig in src/pipeline/config.py")
          else:
              frozen_field_names = set(frozen_fields.keys())
              missing_in_freeze = current_field_names - frozen_field_names
              if missing_in_freeze:
                  errors.append(
                      f"Config fields added but not in freeze: {sorted(missing_in_freeze)}"
                  )

          if errors:
              print("::error::Freeze artifact is STALE. Update it before merging.")
              for e in errors:
                  print(f"  - {e}")
              print()
              print("To fix: python -c \"from src.governance.production_runner import regenerate_freeze; regenerate_freeze()\"")
              sys.exit(1)
          else:
              print(f"Freeze OK ({len(frozen_hashes)} files, {len(frozen_fields)} config fields)")
          PYEOF

  # ─── Full Tests (runs in parallel, non-blocking for auto-merge) ──
  full-tests:
    name: "Full Test Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: pytest-timeout

      - name: Unit tests
        run: pytest tests/ -m "unit" --timeout=300 --cov=src --cov-report=term-missing --tb=short -q

      - name: Contract governance checks
        run: |
          python -c "
          import yaml
          from src.data.contract_validator import ContractValidator

          validator = ContractValidator()
          result = validator.validate()
          print(result.summary())
          assert result.passed, 'Contract validation FAILED'

          contracts = yaml.safe_load(open('contracts/feature_contracts.yaml'))
          untested = [f['feature_name'] for f in contracts['features'] if not f.get('test_ids')]
          assert not untested, f'Untested features: {untested}'
          print(f'All {len(contracts[\"features\"])} features have test_ids.')
          "

      - name: Data-contract tests
        run: pytest tests/ -m "data_contract" -v --tb=short -q

      - name: Leakage tests
        run: pytest tests/ -m "leakage" -v --tb=short -q

      - name: Backtest regression / equivalence tests
        # Locks workers=1 vs workers=N bit-equality (Phase 1.A / Phase 2),
        # opponent_strategy="per_mode" workers-equivalence (Q3 option A),
        # and cached-vs-live bracket equivalence (Phase 5). These tests
        # are skip-clean if torvik / tournament_results / pool_history
        # data is missing; everything they need is committed in the repo.
        run: pytest tests/ -m "backtest_regression" --timeout=600 --tb=short -q

      - name: Track test count
        run: |
          TEST_COUNT=$(pytest tests/ --co -q 2>/dev/null | tail -1 | grep -oP '^\d+')
          echo "Total tests collected: ${TEST_COUNT}"

  # ─── Prospective Integration (Checkpoint 3) ──────────────────────────────
  # Runs the 2026 end-to-end pass that PROSPECTIVE_2027_CHECKPOINTS.md Checkpoint 3
  # is decided on. It lives here because it was previously in NO workflow and no
  # test file: it ran when someone typed its name, and two ordinary commits
  # (broadening the candidate pool to three rating sources, and the v2 freeze
  # superseding v1) silently invalidated two of its checks for weeks. Its last
  # recorded result described a system that no longer existed — 45 distinct
  # champions where the current run has 64. A verification artifact outside CI
  # decays to nothing; see FINDINGS.md 6h.
  #
  # Everything it needs is committed (torvik, ESPN picks, seeds/context,
  # external ratings, historical games), so it is deterministic and hermetic.
  # ~2 minutes at 60k sims.
  #
  # Blocking window matches freeze-check for the same reason: during the live
  # forecast window a broken prospective pipeline must stop a merge, while the
  # rest of the year it stays visible without blocking experimentation.
  prospective-integration:
    name: "Prospective Integration (2026)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: 2026 integration pass
        # No pipe: piping would replace the script's exit status with the
        # pipeline's and turn a real failure green.
        run: python scripts/experiments/integration_test_2026.py

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-integration-2026
          path: artifacts/integration/integration_2026.json

  # ─── Dependency Audit (non-blocking) ─────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: pip-audit
          skip-editable-install: "true"

      - name: Run pip audit
        run: |
          # Generate requirements excluding torch packages (known unfixable CVEs)
          pip freeze | grep -iv '^torch' > /tmp/audit-reqs.txt
          pip-audit --strict --skip-editable \
            --ignore-vuln CVE-2026-4539 \
            -r /tmp/audit-reqs.txt

  # ─── Browser Model ─────────────────────────────────────────────
  # The bracket UI fits its own regression in the browser, so none of the
  # Python suites above touch it. These checks are pure Node with no network
  # and no data regeneration, which is why they can be blocking.
  #
  # The antisymmetry assertion in particular has to run on every commit rather
  # than once: the model has no intercept precisely so that swapping the two
  # teams flips the prediction exactly, and that property is silently
  # destroyed by anything that touches the link, the fit, or the row
  # orientation. A one-off check would not notice.
  browser-model:
    name: "Browser Model"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: for f in docs/fit.js docs/app.js; do node --check "$f"; done

      - name: Link, calibration and antisymmetry checks
        run: node tests/test_calibration.js

      - name: Point-in-time boundary audit
        uses: ./.github/actions/setup-python-env

      - name: Run boundary audit
        run: python3 scripts/audit_snapshot_boundary.py

      # Antisymmetry of the LINK is already asserted in test_calibration.js.
      # This asserts it of the FEATURES, which is a separate property: the link
      # can be perfectly antisymmetric while the feature vector is not, and the
      # board still contradicts itself. Differenced columns negate for free;
      # the venue columns are appended rather than differenced, so their
      # antisymmetry depends on how they were coded and has to be checked.
      # Also asserts the venue term is zero on a neutral court -- the failure
      # there is OMISSION, which looks identical to a correct zero in review.
      - name: Prediction invariants
        run: python3 scripts/assert_prediction_invariants.py

  # ─── Merge Gate ────────────────────────────────────────────────
  # Blocking:     fast-gate (ruff) — always.
  #               browser-model   — always; fast, hermetic, and guards the
  #                                 antisymmetry and point-in-time invariants.
  #               freeze-check    — only Jan 1 – Apr 7 (pre-tournament + tournament window).
  #               prospective-integration — same window as freeze-check, same reason:
  #                                 Checkpoint 3 is decided on this run, so during
  #                                 the live-forecast window a broken prospective
  #                                 pipeline must stop a merge.
  # Non-blocking: freeze-check and prospective-integration Apr 8 – Dec 31
  #               (post-tournament edit window), full-tests, audit.
  all-gates:
    name: "CI"
    if: always()
    needs:
      - fast-gate
      - browser-model
      - freeze-check
      - prospective-integration
      - full-tests
      - audit
    runs-on: ubuntu-latest
    env:
      # Freeze-check enforcement window: MM-DD strings inclusive.
      # Blocking when FREEZE_BLOCK_START <= today <= FREEZE_BLOCK_END.
      # Covers pre-tournament (Jan) through championship weekend (~first Mon of Apr).
      FREEZE_BLOCK_START: "01-01"
      FREEZE_BLOCK_END: "04-07"
    steps:
      - name: Check gates
        run: |
          if [[ "${{ needs.fast-gate.result }}" != "success" ]]; then
            echo "::error::Fast gate failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.browser-model.result }}" != "success" ]]; then
            echo "::error::Browser model checks failed — blocking merge (antisymmetry / point-in-time invariants)"
            exit 1
          fi
          if [[ "${{ needs.freeze-check.result }}" == "failure" ]]; then
            TODAY_MMDD=$(date -u +%m-%d)
            if [[ "$TODAY_MMDD" > "$FREEZE_BLOCK_END" ]]; then
              echo "::warning::Freeze artifact check failed — non-blocking (post-tournament edit window, ${FREEZE_BLOCK_END} < today). Re-freeze the pipeline before the ${FREEZE_BLOCK_START} enforcement window re-opens."
            else
              echo "::error::Freeze artifact check failed — blocking merge (tournament-season enforcement active, ${FREEZE_BLOCK_START} – ${FREEZE_BLOCK_END})"
              exit 1
            fi
          fi
          if [[ "${{ needs.prospective-integration.result }}" == "failure" ]]; then
            TODAY_MMDD=$(date -u +%m-%d)
            if [[ "$TODAY_MMDD" > "$FREEZE_BLOCK_END" ]]; then
              echo "::warning::2026 integration pass failed — non-blocking (post-tournament edit window). Checkpoint 3 in PROSPECTIVE_2027_CHECKPOINTS.md is decided on this run; fix it before the ${FREEZE_BLOCK_START} window re-opens."
            else
              echo "::error::2026 integration pass failed — blocking merge (tournament-season enforcement active, ${FREEZE_BLOCK_START} – ${FREEZE_BLOCK_END}). If the fix needs a frozen PARAMETER VALUE changed, that is a v3 event, not a patch."
              exit 1
            fi
          fi
          if [[ "${{ needs.full-tests.result }}" == "failure" ]]; then
            echo "::warning::Full test suite failed — check results"
          fi
          if [[ "${{ needs.audit.result }}" == "failure" ]]; then
            echo "::warning::Dependency audit failed — check results"
          fi
          echo "Merge gate passed"
