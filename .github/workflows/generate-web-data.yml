name: Generate Web Data

on:
  workflow_call:
    inputs:
      skip_conference_predictions:
        description: "Skip conference predictions (reduces runtime by ~20 min)"
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      skip_conference_predictions:
        description: "Skip conference predictions"
        type: boolean
        default: false

concurrency:
  group: generate-web-data
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Web Data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Download pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-artifacts
          path: artifacts/
        continue-on-error: true

      - name: Pre-flight check
        run: |
          set -euo pipefail
          echo "Checking for required pipeline outputs..."
          if [ -d "artifacts" ] && [ "$(ls -A artifacts/ 2>/dev/null)" ]; then
            echo "Pipeline artifacts found:"
            ls -la artifacts/
          else
            echo "::warning::No pipeline artifacts found. Web data scripts will use existing data."
          fi

      - name: Generate web data
        run: |
          set -euo pipefail
          echo "=== Generating web data ==="
          python scripts/generate_web_data.py

      - name: Generate multi-year team stats table
        run: |
          set -euo pipefail
          echo "=== Generating team stats table (docs/data/team_stats_by_year.json) ==="
          python scripts/generate_team_stats_table.py
          echo "=== Generating pairwise matchup table (docs/data/matchups_by_year.json) ==="
          python scripts/generate_matchup_table.py

      # Powers the "Model Accuracy" tab. Reads the per-game LOYO prediction
      # artifact, so it must run after pipeline artifacts are downloaded.
      # Without this the tab would ship whatever ml_backtest.json happened to
      # be committed and silently go stale.
      - name: Generate ML backtest metrics
        run: |
          set -euo pipefail
          echo "=== Generating ML backtest metrics (docs/data/ml_backtest.json) ==="
          python scripts/generate_ml_backtest_data.py

      - name: Generate pool-aware, region, and exhaustive brackets
        run: |
          set -euo pipefail
          echo "=== Generating meta_region_poolaware bracket (docs/data/bracket_2026.json) ==="
          python scripts/generate_poolaware_bracket.py
          echo "=== Generating meta_region bracket (docs/data/bracket_2026_region.json) ==="
          python scripts/generate_region_bracket.py
          echo "=== Generating meta_exhaustive bracket (docs/data/bracket_2026_exhaustive.json) ==="
          python scripts/generate_exhaustive_bracket.py
          echo "=== Generating real 2026 outcome for the retrospective panel (docs/data/actual_2026.json) ==="
          python scripts/generate_actual_results.py

      - name: Build dashboard data
        run: |
          set -euo pipefail
          echo "=== Building dashboard data ==="
          python scripts/build_dashboard_data.py

      - name: Run conference predictions
        if: ${{ !inputs.skip_conference_predictions }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== Running conference predictions ==="
          python scripts/run_conference_predictions.py

      - name: Validate generated files
        run: |
          set -euo pipefail
          python scripts/validate_web_data.py

      - name: Upload web data artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-data
          path: docs/
          retention-days: 3
          if-no-files-found: error
