name: Run Pipeline & Deploy Web App

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate only, skip full pipeline)"
        type: boolean
        default: false
      skip_production:
        description: "Skip production pipeline (only regenerate web data from existing artifacts)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run Production Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Validate production config (dry run)
        run: python src/run_production_2026.py --dry-run

      - name: Run production pipeline
        if: ${{ !inputs.dry_run && !inputs.skip_production }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "Running production pipeline..."
          python src/run_production_2026.py
          echo "Pipeline completed."

      - name: Generate web app data
        if: ${{ !inputs.dry_run }}
        run: |
          echo "=== Generating web data ==="
          python scripts/generate_web_data.py

          echo "=== Building dashboard data ==="
          python scripts/build_dashboard_data.py

          echo "=== Running conference predictions ==="
          python scripts/run_conference_predictions.py || echo "Conference predictions failed (non-fatal)"

          echo "=== Web data generation complete ==="
          ls -la docs/data/

      - name: Validate generated files
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "Validating generated JSON files..."

          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "docs/data/bracket_2026.json",
              "docs/data/validation_2025.json",
              "docs/data/model_metrics.json",
              "docs/data/team_profiles.json",
              "docs/data/dashboard.json",
          ]

          for f in required:
              p = Path(f)
              if not p.exists():
                  raise SystemExit(f"MISSING: {f}")
              data = json.loads(p.read_text())
              if not data:
                  raise SystemExit(f"EMPTY: {f}")
              print(f"  OK: {f} ({p.stat().st_size:,} bytes)")

          # Check validation data has per-year entries
          val = json.loads(Path("docs/data/validation_2025.json").read_text())
          years = [e["year"] for e in val.get("per_year", [])]
          print(f"  Validation years: {years}")
          print("All files validated.")
          PY

      - name: Commit updated web data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/ artifacts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update web app data from pipeline run

          Regenerated docs/data/ from latest pipeline artifacts.
          Triggered by: ${{ github.actor }} via workflow_dispatch"
            git push
            echo "Changes pushed."
          fi

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: run-pipeline
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with pipeline updates)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes pipeline commit)
        run: git pull origin ${{ github.ref_name }}

      - name: Validate docs artifacts
        run: |
          set -euo pipefail
          for f in docs/index.html docs/style.css docs/data/bracket_2026.json docs/data/validation_2025.json docs/data/model_metrics.json docs/data/team_profiles.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing: $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
