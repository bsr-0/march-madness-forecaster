name: Run Pipeline & Deploy Web App

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate only, skip full pipeline)"
        type: boolean
        default: false
      skip_production:
        description: "Skip production pipeline (only regenerate web data from existing artifacts)"
        type: boolean
        default: false
      skip_conference_predictions:
        description: "Skip conference predictions (reduces web data generation time)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  # ─── Stage 1: Run the ML production pipeline ─────────────────────
  production-pipeline:
    name: Production Pipeline
    uses: ./.github/workflows/run-production-pipeline.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      skip_production: ${{ inputs.skip_production }}
    secrets:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

  # ─── Stage 2: Generate web data from pipeline artifacts ──────────
  web-data:
    name: Generate Web Data
    needs: production-pipeline
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/generate-web-data.yml
    with:
      skip_conference_predictions: ${{ inputs.skip_conference_predictions }}

  # ─── Stage 3: Upload Kaggle submission ───────────────────────────
  kaggle-upload:
    name: Upload Kaggle Submission
    needs: production-pipeline
    if: ${{ !inputs.dry_run && !inputs.skip_production }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-artifacts
          path: artifacts/

      - name: Upload to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          pip install kaggle
          SUBMISSION="artifacts/kaggle_submission_2026.csv"
          if [ -f "$SUBMISSION" ]; then
            echo "Found submission: $SUBMISSION"
            wc -l "$SUBMISSION"
            kaggle competitions submit \
              -c march-machine-learning-mania-2026 \
              -f "$SUBMISSION" \
              -m "Automated submission from pipeline run (triggered by ${{ github.actor }})"
            echo "Kaggle submission uploaded."
          else
            echo "::warning::No Kaggle submission CSV found at $SUBMISSION — skipping upload."
          fi

  # ─── Stage 4: Deploy to GitHub Pages ─────────────────────────────
  deploy:
    name: Deploy Pages
    needs: web-data
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/deploy-pages.yml
