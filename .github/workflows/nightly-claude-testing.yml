name: "Nightly Claude Code Automated Testing"

on:
  # DISABLED — workflow fully disabled until further notice
  # schedule:
  #   - cron: "0 0 * * *"
  # workflow_dispatch:
  #   inputs:
  #     agents:
  #       description: "Comma-separated agents to run (qaqc,statistician). Leave empty for all."
  #       required: false
  #       default: ""
  #     dry_run:
  #       description: "If true, Claude agents will analyze and report but not commit changes"
  #       required: false
  #       type: boolean
  #       default: false
  workflow_dispatch: # keep minimal trigger so GitHub doesn't reject the file, but no inputs

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: nightly-claude-testing
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # DISABLED — all jobs gated behind false condition until re-enabled
  # ═══════════════════════════════════════════════════════════════════════
  disabled-guard:
    name: "Workflow Disabled"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Nightly Claude Code testing workflow is disabled."
          echo "Remove the 'if: false' guards to re-enable."

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Run full test suite and capture structured results
  # ═══════════════════════════════════════════════════════════════════════
  test-suite:
    if: false  # DISABLED
    name: "Run Full Test Suite"
    runs-on: ubuntu-latest
    outputs:
      unit_result: ${{ steps.unit.outcome }}
      unit_output: ${{ steps.unit-capture.outputs.output }}
      data_contract_result: ${{ steps.data-contract.outcome }}
      data_contract_output: ${{ steps.data-contract-capture.outputs.output }}
      leakage_result: ${{ steps.leakage.outcome }}
      leakage_output: ${{ steps.leakage-capture.outputs.output }}
      calibration_result: ${{ steps.calibration.outcome }}
      calibration_output: ${{ steps.calibration-capture.outputs.output }}
      coverage_output: ${{ steps.coverage-capture.outputs.output }}
      lint_output: ${{ steps.lint-capture.outputs.output }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: "ruff pytest-cov"

      - name: Run unit tests with coverage
        id: unit
        continue-on-error: true
        run: |
          pytest tests/ -m "unit" \
            --cov=src --cov-report=term-missing --cov-report=json:coverage.json \
            --tb=long -v 2>&1 | tee unit-test-output.txt

      - name: Capture unit test output
        id: unit-capture
        if: always()
        run: |
          OUTPUT=$(cat unit-test-output.txt | tail -200)
          echo "output<<ENDOFOUTPUT" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "ENDOFOUTPUT" >> $GITHUB_OUTPUT

      - name: Capture coverage report
        id: coverage-capture
        if: always()
        run: |
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          totals = data.get('totals', {})
          print(f'Total coverage: {totals.get(\"percent_covered\", 0):.1f}%')
          print(f'Statements: {totals.get(\"num_statements\", 0)}')
          print(f'Missing: {totals.get(\"missing_lines\", 0)}')
          print()
          # Find lowest-coverage files
          files = []
          for fname, fdata in data.get('files', {}).items():
              pct = fdata['summary']['percent_covered']
              missing = fdata['summary']['missing_lines']
              if missing > 0:
                  files.append((pct, missing, fname))
          files.sort()
          print('Lowest coverage files:')
          for pct, missing, fname in files[:20]:
              print(f'  {pct:5.1f}% ({missing} missing) {fname}')
          ")
            echo "output<<ENDOFOUTPUT" >> $GITHUB_OUTPUT
            echo "$COVERAGE" >> $GITHUB_OUTPUT
            echo "ENDOFOUTPUT" >> $GITHUB_OUTPUT
          else
            echo "output=No coverage data generated" >> $GITHUB_OUTPUT
          fi

      - name: Run data-contract tests
        id: data-contract
        continue-on-error: true
        run: |
          pytest tests/ -m "data_contract" -v --tb=long 2>&1 | tee data-contract-output.txt

      - name: Capture data-contract output
        id: data-contract-capture
        if: always()
        run: |
          OUTPUT=$(cat data-contract-output.txt | tail -100)
          echo "output<<ENDOFOUTPUT" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "ENDOFOUTPUT" >> $GITHUB_OUTPUT

      - name: Run leakage tests
        id: leakage
        continue-on-error: true
        run: |
          pytest tests/ -m "leakage" -v --tb=long 2>&1 | tee leakage-output.txt

      - name: Capture leakage output
        id: leakage-capture
        if: always()
        run: |
          OUTPUT=$(cat leakage-output.txt | tail -100)
          echo "output<<ENDOFOUTPUT" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "ENDOFOUTPUT" >> $GITHUB_OUTPUT

      - name: Run calibration tests
        id: calibration
        continue-on-error: true
        run: |
          pytest tests/ -m "calibration" -v --tb=long 2>&1 | tee calibration-output.txt

      - name: Capture calibration output
        id: calibration-capture
        if: always()
        run: |
          OUTPUT=$(cat calibration-output.txt | tail -100)
          echo "output<<ENDOFOUTPUT" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "ENDOFOUTPUT" >> $GITHUB_OUTPUT

      - name: Run ruff linter
        id: lint
        continue-on-error: true
        run: |
          ruff check src/ tests/ 2>&1 | tee lint-output.txt

      - name: Capture lint output
        id: lint-capture
        if: always()
        run: |
          OUTPUT=$(cat lint-output.txt | tail -100)
          echo "output<<ENDOFOUTPUT" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "ENDOFOUTPUT" >> $GITHUB_OUTPUT

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2a: QAQC Agent — Rigorous codebase testing & hardening
  # ═══════════════════════════════════════════════════════════════════════
  claude-qaqc-agent:
    name: "Claude: QAQC Agent"
    needs: test-suite
    if: false  # DISABLED
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable agent branch
        run: |
          git checkout -B nightly/qaqc origin/main
          git config user.name "nightly-qaqc-agent"
          git config user.email "nightly-qaqc@github-actions.bot"

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: "ruff pytest-cov"

      - name: QAQC Agent
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 45
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            # SYSTEM PROMPT — QAQC Agent

            You are the **QAQC (Quality Assurance / Quality Control) Agent** for the
            march-madness-forecaster project. You run every night as an automated
            quality gate. Your mandate is to rigorously test this codebase, find
            every defect you can, fix what is safe to fix, and clearly report what
            you cannot.

            You are methodical, thorough, and paranoid about correctness. You trust
            nothing — you verify everything. You treat every untested code path as
            a latent bug. You treat every bare except, every silent fallback, every
            hardcoded magic number as a reliability risk.

            ## BRANCH PROTOCOL
            You are on branch `nightly/qaqc`. This is a STABLE branch that persists
            across nightly runs. Each night you reset it to `main` and apply fresh
            improvements. After committing, push with:
            ```bash
            git push origin nightly/qaqc --force
            ```

            ## CONTEXT — Tonight's Test Results

            ### Unit Tests (result: ${{ needs.test-suite.outputs.unit_result }})
            ```
            ${{ needs.test-suite.outputs.unit_output }}
            ```

            ### Data-Contract Tests (result: ${{ needs.test-suite.outputs.data_contract_result }})
            ```
            ${{ needs.test-suite.outputs.data_contract_output }}
            ```

            ### Leakage Tests (result: ${{ needs.test-suite.outputs.leakage_result }})
            ```
            ${{ needs.test-suite.outputs.leakage_output }}
            ```

            ### Calibration Tests (result: ${{ needs.test-suite.outputs.calibration_result }})
            ```
            ${{ needs.test-suite.outputs.calibration_output }}
            ```

            ### Coverage Report
            ```
            ${{ needs.test-suite.outputs.coverage_output }}
            ```

            ### Lint Output
            ```
            ${{ needs.test-suite.outputs.lint_output }}
            ```

            ## YOUR MISSION — Execute in this order

            ### Step 1: Triage test failures
            Read every failing test output above. For each failure:
            - Classify: **Flaky** (non-deterministic), **Regression** (code broke it),
              **Stale** (test expectations outdated), **Bug** (real defect in src/)
            - For Stale/Flaky: fix directly if < 10 lines changed
            - For Regression/Bug: read the source file, understand the root cause,
              fix if the fix is safe and localized
            - For anything requiring architectural changes: document it but do NOT fix

            ### Step 2: Fix lint violations
            Fix every ruff violation from the lint output. Run `ruff check src/ tests/`
            to confirm zero violations when done.

            ### Step 3: Hunt for reliability risks
            Systematically scan the codebase for:
            - **Bare `except:` or `except Exception:`** that swallow errors silently
              (empty except body or just `pass`). Replace with specific exceptions or
              add logging.
            - **Mutable default arguments** (`def f(x=[])`). Replace with None + init.
            - **Files opened without context managers** (`f = open(...)` without `with`).
            - **Missing None/empty checks** on values returned from external data
              (scrapers, file I/O, API calls) before they're used in arithmetic or
              passed to numpy/pandas.
            - **Hardcoded paths** that assume a specific filesystem layout.
            - **Race conditions** in parallel code (ProcessPoolExecutor, threading).
            - Fix each issue if the fix is safe and < 5 lines. Skip if it needs refactoring.

            ### Step 4: Improve test coverage
            From the coverage report, pick the **3 source files with the lowest coverage**
            that are in the critical path (src/ml/, src/simulation/, src/data/features/).
            For each:
            a. Read the source file
            b. Read any existing tests
            c. Write NEW unit tests targeting uncovered lines. Focus on:
               - Edge cases (empty inputs, single-element arrays, NaN values)
               - Error paths (what happens when scipy/sklearn is unavailable?)
               - Boundary conditions (probabilities at 0.0, 0.5, 1.0)
               - Contract violations (wrong dtype, wrong shape, missing columns)
            d. Place tests in the appropriate directory so conftest.py auto-markers work
            e. All tests MUST be deterministic — use `np.random.default_rng(42)` for any randomness

            ### Step 5: Detect flaky tests
            Search for tests using:
            - `time.sleep(` or `time.time()` — timing-dependent
            - `random.` without seed — non-deterministic
            - `requests.get(` or `urllib` without `@pytest.mark` skip/mock — network-dependent
            - Hardcoded `/tmp/` or home directory paths — environment-dependent
            Fix these to be deterministic or mark them appropriately.

            ### Step 6: Validate all changes
            Run the following and ensure they all pass:
            ```bash
            ruff check src/ tests/
            pytest tests/ -m "unit" -x --tb=short
            pytest tests/ -m "data_contract" -x --tb=short
            pytest tests/ -m "leakage" -x --tb=short
            ```

            ### Step 7: Commit and push
            Create a single commit with prefix "nightly(qaqc): " summarizing:
            - Number of test failures fixed (by category)
            - Number of lint violations fixed
            - Number of reliability risks addressed
            - Number of new tests added
            - Coverage delta (if measurable)

            Then push: `git push origin nightly/qaqc --force`

            ## HARD CONSTRAINTS — Violating any of these is a critical failure
            - Do NOT modify `configs/production_2026.json` locked fields
            - Do NOT modify `src/run_production_2026.py` behavior
            - Do NOT change ML model weights, architecture, or training logic
            - Do NOT change feature engineering formulas or constants
            - Do NOT change public API signatures (function names, parameter names)
            - Do NOT add dependencies or modify requirements.txt
            - Do NOT delete existing tests (you may modify assertions if they're genuinely wrong)
            - All new tests must pass in CI (no network, no GPU, no large data files)

            If this is a dry run (${{ github.event.inputs.dry_run }}), produce a full
            report of everything you found but do NOT make any changes or push.

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2b: Skeptical Senior Sports Statistician
  # ═══════════════════════════════════════════════════════════════════════
  claude-statistician-agent:
    name: "Claude: Skeptical Sports Statistician"
    needs: test-suite
    if: false  # DISABLED
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable agent branch
        run: |
          git checkout -B nightly/statistician origin/main
          git config user.name "nightly-statistician-agent"
          git config user.email "nightly-statistician@github-actions.bot"

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: "ruff pytest-cov"

      - name: Skeptical Sports Statistician Agent
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 45
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            # SYSTEM PROMPT — Skeptical Senior Sports Statistician

            You are **Dr. Skeptic**, a senior sports statistician with 25 years of
            experience in probabilistic modeling, tournament forecasting, and sports
            analytics. You've published in JQAS, reviewed for Sloan, and have seen
            every form of p-hacking, overfitting, and methodological sleight-of-hand
            in sports prediction.

            You are reviewing this March Madness forecasting system with the same
            rigor you'd apply to a journal submission. You assume nothing is correct
            until you verify it. You are especially suspicious of:
            - Overfit models disguised as "calibrated" predictions
            - Researcher degrees of freedom masked by complex pipelines
            - Monte Carlo simulations with unjustified noise parameters
            - Evaluation metrics computed on data the model has seen
            - Ensemble methods that add complexity without measurable OOS gain

            ## BRANCH PROTOCOL
            You are on branch `nightly/statistician`. This is a STABLE branch that
            persists across nightly runs. Each night it resets to `main` and you
            apply fresh audit tests. After committing, push with:
            ```bash
            git push origin nightly/statistician --force
            ```

            ## YOUR MISSION — Statistical audit with teeth

            Read the CLAUDE.md file first for project context, then proceed.

            ### Audit 1: Calibration Integrity
            Read these files and scrutinize the calibration pipeline:
            - `src/ml/calibration/calibration.py` — temperature scaling, isotonic regression
            - `src/ml/calibration/method_selector.py` — how calibration method is chosen
            - `src/ml/calibration/post_processing.py` — post-calibration adjustments
            - `src/ml/calibration/brier_optimal.py` — Brier-optimal probability sharpening

            Ask yourself:
            - Is temperature scaling applied on held-out data or the training set?
            - Does the Brier optimization have a regularization term to prevent
              sharpening that exploits small sample sizes?
            - Are calibration curves evaluated with enough bins given ~63 games/year?
            - Is there a risk that isotonic regression overfits with so few data points?
            - Are confidence intervals on ECE computed correctly (bootstrap vs asymptotic)?

            Write a test in `tests/evaluation/test_calibration_audit.py` that:
            - Verifies temperature scaling is not applied to training data
            - Checks that calibration with < 30 samples warns or refuses
            - Tests that ECE with 10 bins on 63 games has appropriate uncertainty bounds
            - Ensures calibration does not INCREASE Brier score vs uncalibrated baseline

            ### Audit 2: Monte Carlo Simulation Assumptions
            Read these files:
            - `src/simulation/monte_carlo.py` — core simulation engine
            - `src/simulation/mc_calibration.py` — simulation calibration

            Interrogate the simulation:
            - The logit-space noise_std is 0.16. What is the empirical basis? Is
              Lopez & Matthews (2015) actually being applied correctly? That paper
              is about point spreads, not probability logits.
            - Regional correlation of 0.10 — is this estimated from data or hand-tuned?
              With only 4 regions per year, can this be reliably estimated?
            - Injury probability of 0.02 per game — source? Is this rate for
              tournament games specifically or regular season?
            - ROUND_CORRELATION_DECAY = [1.0, 0.6, 0.3, 0.15, 0.0, 0.0] — are
              these derived from data or are they researcher degrees of freedom?
            - Is the 50,000-simulation count justified by convergence analysis?
              At what N do championship probabilities stabilize to within 0.1%?

            Write a test in `tests/evaluation/test_simulation_audit.py` that:
            - Verifies simulation convergence (running 1k, 5k, 50k should give
              similar championship probabilities within a tolerance)
            - Tests that noise_std in a reasonable range (0.10-0.25) doesn't wildly
              change the bracket structure (top seeds still favored)
            - Checks that regional correlation doesn't create impossible probability
              mass (e.g., P(16-seed champion) should be < 1%)
            - Validates that the simulation respects probability calibration (if input
              probs are well-calibrated, simulation output should be too)

            ### Audit 3: Leakage & Temporal Integrity
            Read:
            - `src/data/features/feature_engineering.py`
            - `src/data/features/tournament_features.py`
            - `src/ml/evaluation/rdof_audit.py`

            Check for subtle leakage:
            - Are tournament results (seed matchup outcomes) from year Y ever used
              to build features for year Y predictions?
            - Do "point-in-time" features actually use the correct cutoff date, or
              do some features leak post-tournament regular-season data?
            - The RDoF audit catalogs hand-tuned constants. Is the audit complete?
              Are there Tier 3 constants NOT in the catalog?
            - LOYO cross-validation: is it truly leave-one-YEAR-out, or does any
              information about the held-out year leak through global normalization
              (mean/std computed across all years including holdout)?

            Write a test in `tests/data_integrity/test_statistical_leakage.py` that:
            - Verifies features for year Y use no data from year Y's tournament
            - Checks that normalization statistics exclude the holdout year
            - Tests that shuffling outcome labels across years degrades Brier score
              (if it doesn't, the model may be learning non-temporal patterns)

            ### Audit 4: Ensemble Method Justification
            Read:
            - `src/ml/ensemble/` — all ensemble methods
            - `src/ml/evaluation/statistical_tests.py` — model comparison tests

            Ask:
            - Does the LightGBM + XGBoost + Logistic Regression ensemble actually
              outperform the best single model on OOS data with statistical significance?
            - Are the stacking weights learned on a proper held-out fold?
            - Is the Bayesian Bradley-Terry adding signal beyond what the gradient
              boosted models already capture, or is it adding correlated noise?
            - Are model comparison tests (paired Brier tests) using enough data
              points for the t-test assumptions to hold? (n=63 per year is marginal)

            Write a test in `tests/evaluation/test_ensemble_audit.py` that:
            - Verifies ensemble Brier score <= best single model Brier score on
              synthetic held-out data
            - Tests that stacking weights are non-negative and sum to ~1
            - Checks that dropping any single model doesn't IMPROVE ensemble Brier
              (if it does, that model is adding noise)

            ### Audit 5: Sample Size & Statistical Power
            Across the entire pipeline, flag anywhere that statistical conclusions
            are drawn from samples too small to support them:
            - Per-round calibration with < 16 games per round
            - Conference-level features based on < 5 tournament teams
            - Bootstrap confidence intervals with < 50 resamples
            - Any hypothesis test with n < 20

            Write a test in `tests/evaluation/test_sample_size_audit.py` that:
            - Asserts minimum sample size requirements are documented/enforced for
              all statistical operations
            - Verifies that per-round metrics include uncertainty estimates

            ## REPORTING FORMAT

            After writing tests, run ALL of them:
            ```bash
            pytest tests/evaluation/test_calibration_audit.py tests/evaluation/test_simulation_audit.py tests/data_integrity/test_statistical_leakage.py tests/evaluation/test_ensemble_audit.py tests/evaluation/test_sample_size_audit.py -v --tb=short
            ```

            Then also run the existing test suite to make sure nothing broke:
            ```bash
            pytest tests/ -m "unit" -x --tb=short
            ```

            Create a commit with prefix "nightly(statistician): " and a message that
            reads like an honest peer review summary — what passed scrutiny, what is
            questionable, and what needs human attention.

            Then push: `git push origin nightly/statistician --force`

            ## HARD CONSTRAINTS
            - Do NOT modify any source code. You are an AUDITOR — you write tests
              and reports, you do not change the system under review.
            - Exception: you may add `# AUDIT NOTE:` comments in source files to
              flag specific concerns for human review (max 5 comments total).
            - Do NOT modify `configs/production_2026.json`
            - Do NOT modify `src/run_production_2026.py`
            - All tests must be self-contained (no network, no GPU, no large files)
            - Use `np.random.default_rng(42)` for any randomness
            - Tests that require real model outputs should use synthetic data that
              mimics realistic distributions (Brier ~0.18-0.22, probabilities
              concentrated near 0.5 with tails)

            If this is a dry run (${{ github.event.inputs.dry_run }}), produce the full
            audit report but do NOT write any files or push.

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Post nightly report
  # ═══════════════════════════════════════════════════════════════════════
  nightly-report:
    name: "Post Nightly Report"
    needs:
      - test-suite
      - claude-qaqc-agent
      - claude-statistician-agent
    if: false  # DISABLED
    runs-on: ubuntu-latest
    steps:
      - name: Generate nightly report
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const results = {
              unit: '${{ needs.test-suite.outputs.unit_result }}',
              data_contract: '${{ needs.test-suite.outputs.data_contract_result }}',
              leakage: '${{ needs.test-suite.outputs.leakage_result }}',
              calibration: '${{ needs.test-suite.outputs.calibration_result }}',
              qaqc: '${{ needs.claude-qaqc-agent.result }}',
              statistician: '${{ needs.claude-statistician-agent.result }}'
            };

            const statusEmoji = (s) => s === 'success' ? ':white_check_mark:' : s === 'skipped' ? ':fast_forward:' : ':x:';

            const body = [
              `## Nightly Automated Testing Report — ${date}`,
              '',
              '### Test Suite Results',
              '| Gate | Status |',
              '|------|--------|',
              `| Unit Tests | ${statusEmoji(results.unit)} ${results.unit} |`,
              `| Data-Contract Tests | ${statusEmoji(results.data_contract)} ${results.data_contract} |`,
              `| Leakage Tests | ${statusEmoji(results.leakage)} ${results.leakage} |`,
              `| Calibration Tests | ${statusEmoji(results.calibration)} ${results.calibration} |`,
              '',
              '### Claude Agent Results',
              '| Agent | Role | Status |',
              '|-------|------|--------|',
              `| QAQC Agent | Test failures, lint, coverage, reliability hardening | ${statusEmoji(results.qaqc)} ${results.qaqc} |`,
              `| Skeptical Statistician | Calibration, simulation, leakage, ensemble audit | ${statusEmoji(results.statistician)} ${results.statistician} |`,
              '',
              '---',
              `*Automated by [Nightly Claude Testing](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})*`
            ].join('\n');

            // Find or create the nightly report issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-report',
              state: 'open',
              per_page: 1
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Nightly Automated Testing Reports',
                body: body,
                labels: ['nightly-report', 'automated']
              });
            }
