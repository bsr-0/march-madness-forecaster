name: Deploy docs on push

# Deploys the static docs/ folder to GitHub Pages whenever the docs
# HTML/CSS/JS files change on main. Runs independently of the full ML
# pipeline so UI changes are visible immediately after a push.
#
# The full pipeline (run-pipeline.yml) regenerates docs/data/*.json
# and also deploys. This workflow only handles the static shell files
# (index.html, app.js, style.css) without touching the JSON data.

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/app.js"
      - "docs/style.css"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
