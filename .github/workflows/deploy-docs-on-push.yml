name: Deploy docs on push

# Deploys the static docs/ folder to GitHub Pages whenever anything the site
# actually serves changes on main. This is now the ONLY deploy path (see
# below) so UI changes are visible immediately after a push.
#
# THE FILTER IS A LIST OF FILES THAT MUST EXIST, and it silently stopped
# matching. It previously watched "docs/style.css", which is not the name of
# the stylesheet -- that file is docs/app.css and has presumably never been
# deployed by this workflow. It also omitted docs/fit.js, where the model
# lives, and docs/data/**, so regenerating the season payloads and pushing them
# left the site serving the previous brackets. None of that errors: the push
# succeeds, no run appears, and the site is quietly stale.
#
# Prefer a broad "docs/**" over enumerating files. A path filter that lists
# filenames breaks the moment one is renamed, and breaks by doing nothing.
#
# generate-web-data.yml + deploy-pages.yml used to regenerate docs/data/*.json
# and deploy for a bracket_2026.json / team_profiles.json / style.css UI that
# no longer exists; docs/app.js has never fetched any of those files. Both
# workflows were `workflow_call`-only and their sole caller, run-pipeline.yml,
# was removed with the ML pipeline on 2026-09-11 (audit H10), which made them
# unreachable -- they were deleted the same day rather than repaired. The
# season_*.json / candidates_*.json this site actually reads are built by
# scripts/experiments/build_candidate_artifact.py + scripts/build_ui_payload.py
# and committed by hand; wiring that build into CI is audit recommendation 8,
# still open.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
