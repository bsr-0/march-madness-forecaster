name: Deploy docs on push

# Deploys the static docs/ folder to GitHub Pages whenever anything the site
# actually serves changes on main. Runs independently of the full ML pipeline
# so UI changes are visible immediately after a push.
#
# THE FILTER IS A LIST OF FILES THAT MUST EXIST, and it silently stopped
# matching. It previously watched "docs/style.css", which is not the name of
# the stylesheet -- that file is docs/app.css and has presumably never been
# deployed by this workflow. It also omitted docs/fit.js, where the model
# lives, and docs/data/**, so regenerating the season payloads and pushing them
# left the site serving the previous brackets. None of that errors: the push
# succeeds, no run appears, and the site is quietly stale.
#
# Prefer a broad "docs/**" over enumerating files. A path filter that lists
# filenames breaks the moment one is renamed, and breaks by doing nothing.
#
# run-pipeline.yml also regenerates docs/data/*.json and deploys; the overlap
# is harmless, and this path matters when the payloads are rebuilt by hand.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
