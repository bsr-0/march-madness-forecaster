[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]  # errors, pyflakes, warnings
ignore = [
    "E501",  # line too long (handled editorially)
    "W293",  # blank line with whitespace
    "W291",  # trailing whitespace
    "E402",  # module-level import not at top (conditional imports)
    "F401",  # unused import (many re-exports and conditional imports)
    "F841",  # unused variable (often intentional destructuring)
    "F811",  # redefined-while-unused (conditional import fallbacks)
    "F821",  # undefined name (try/except import patterns)
    "F541",  # f-string without placeholders
    "F601",  # multi-value repeated key literal
]

[tool.pytest.ini_options]
addopts = "-x --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "data_integrity: marks Phase 3 data integrity tests",
    "evidence_structural: leakage evidence from source code inspection",
    "evidence_synthetic: leakage evidence from injected canary detection",
    "evidence_historical: leakage evidence from real historical data verification",
    "unit: fast, isolated unit tests (no I/O, no data dependencies)",
    "data_contract: feature contract and schema validation tests",
    "leakage: temporal leakage detection tests (statistical, not just mechanical)",
    "backtest_regression: backtest and LOYO regression tests",
    "freeze: pipeline freeze and reproducibility tests",
    "production: production path governance and validation tests",
    "calibration: calibration method and benchmark tests",
    "live_protocol: 2026 live protocol enforcement tests",
    "slow: long-running tests",
    "timeout: tests with explicit timeout",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 20

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["tests/", "scripts/"]
