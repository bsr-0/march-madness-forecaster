[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]  # errors, pyflakes, warnings
ignore = [
    "E501",  # line too long (handled editorially)
    "W293",  # blank line with whitespace
    "W291",  # trailing whitespace
    "E402",  # module-level import not at top (conditional imports)
    "F401",  # unused import (many re-exports and conditional imports)
    "F841",  # unused variable (often intentional destructuring)
    "F811",  # redefined-while-unused (conditional import fallbacks)
    "F821",  # undefined name (try/except import patterns)
    "F541",  # f-string without placeholders
    "F601",  # multi-value repeated key literal
]

[tool.pytest.ini_options]
addopts = "-x --tb=short"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80  # Raised from 60%; V7 S23 requires comprehensive coverage

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["tests/", "scripts/"]
