<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bracket Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=16">
</head>
<body>

<!-- Two destinations. The board is the product; Diagnostics is a workbench for
     interrogating the model that fills it, and changes no pick. They share one
     variable selection so the diagnostics always describe what is on the board. -->
<header class="bar">
  <div class="bar-l">
    <span class="mark">Bracket Lab</span>
    <nav class="years" id="years" aria-label="Season"></nav>
  </div>
  <div class="bar-r">
    <nav class="tabs" id="tabs" aria-label="View">
      <button class="tab on" data-tab="bracket">Bracket</button>
      <button class="tab" data-tab="diagnostics">Diagnostics</button>
    </nav>
  </div>
</header>

<main id="main">

  <!-- Weight controls. Present only in "My weights"; a single variable is just
       one weight at full and the rest at zero. -->
  <section class="panel" id="weights" hidden>
    <div class="panel-head">
      <p class="panel-title">How to fill the bracket</p>
      <div class="panel-actions">
        <button class="ghost" id="clear-w">Reset</button>
        <span class="hint" id="w-hint"></span>
      </div>
    </div>
    <div class="prebuilt" id="prebuilt"></div>
    <div class="groups" id="groups"></div>
  </section>

  <section class="note" id="mode-note"></section>

  <!-- The fitted model, printed. Empty unless variables are enabled. -->
  <section id="equation"></section>

  <section class="board" id="board"></section>

  <section class="empty" id="empty" hidden></section>

  <!-- Diagnostics. Refits by ordinary least squares on the same rows and
       columns, because a ridge-penalised coefficient has no standard error in
       the usual sense. Nothing here feeds the board. -->
  <section class="diag" id="diagnostics" hidden></section>

</main>

<!-- Team inspector. Opens from any team on the board. -->
<aside class="drawer" id="drawer" hidden aria-label="Team detail">
  <div class="drawer-head">
    <div>
      <p class="d-name" id="d-name"></p>
      <p class="d-sub" id="d-sub"></p>
    </div>
    <button class="x" id="d-close" aria-label="Close">&times;</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<script src="fit.js?v=7"></script>
<script src="diag.js?v=2"></script>
<script src="app.js?v=20"></script>
</body>
</html>
