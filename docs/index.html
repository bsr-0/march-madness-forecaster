<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bracket Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=19">
</head>
<body>

<!-- One destination. The board is the product: pick a season, choose what you
     are optimising for, and read the bracket that falls out. Per-variable
     selection was removed 2026-08-29 (it measured null), and the Diagnostics
     workbench beside it went on 2026-08-27. -->
<header class="bar">
  <div class="bar-l">
    <span class="mark">Bracket Lab</span>
    <nav class="years" id="years" aria-label="Season"></nav>
  </div>
</header>

<main id="main">

  <!-- Strategy choice. Replaces the old per-variable weighting: the question a
       bracket answers is "what am I optimising for", not "which stats do I
       like".

       The two precomputed strategies are not the same bracket and in 2026 name
       different champions. They are also arrived at differently, which the tags
       say: P(1st) has no closed form, since it depends on the whole opponent
       field, so the win-maximising card is a FIXED RULE whose evidence is
       out-of-sample performance across 15 seasons; expected points does have a
       closed form and is solved exactly on the bracket. The third fits a model
       in the browser and is the only one the history slider applies to. -->
  <section class="panel" id="strategy" hidden>
    <div class="panel-head">
      <p class="panel-title">What are you optimising for</p>
    </div>
    <div class="strat-list" id="strat-list"></div>
  </section>

  <!-- Three filter axes over the precomputed candidate pool. Each narrows WHICH
       brackets are eligible; the strategy cards decide what is maximised over
       them. One-seed count and depth sound alike and are not: both of
       "Connecticut(2), Gonzaga(3), Florida(1), Michigan(1)" and "Michigan
       State(3), Purdue(2), Illinois(3), Iowa State(2)" reach exactly a 3 seed,
       and they are completely different brackets. -->
  <section class="panel" id="champions" hidden>
    <div class="panel-head"><p class="panel-title">Back a champion</p></div>
    <div class="chips" id="champ-list"></div>
    <p class="prior-note" id="champ-note"></p>
  </section>

  <section class="panel" id="ones" hidden>
    <div class="panel-head"><p class="panel-title">How many 1 seeds in the Final Four</p></div>
    <div class="chips" id="ones-list"></div>
    <p class="prior-note" id="ones-note"></p>
  </section>

  <section class="panel" id="shapes" hidden>
    <div class="panel-head"><p class="panel-title">How deep does your Final Four reach</p></div>
    <div class="chips" id="shape-list"></div>
    <p class="prior-note" id="shape-note"></p>
  </section>

  <section class="note" id="mode-note"></section>

  <!-- The fitted model, printed. Empty unless variables are enabled. -->
  <section id="equation"></section>

  <section class="board" id="board"></section>

  <section class="empty" id="empty" hidden></section>

</main>

<!-- Team inspector. Opens from any team on the board. -->
<aside class="drawer" id="drawer" hidden aria-label="Team detail">
  <div class="drawer-head">
    <div>
      <p class="d-name" id="d-name"></p>
      <p class="d-sub" id="d-sub"></p>
    </div>
    <button class="x" id="d-close" aria-label="Close">&times;</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<!-- BUMP ?v= ON EVERY CHANGE TO THESE FILES. It is the only cache-busting
     mechanism on the page and it fails silently: the deploy succeeds, the new
     file sits on the server, and returning browsers keep running the old one
     against the new data. v=23 shipped the strategy picker without a bump, so
     anyone with a warm cache kept seeing the removed variable-selection UI. -->
<script src="fit.js?v=10"></script>
<script src="app.js?v=37"></script>
</body>
</html>
